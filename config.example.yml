# Configuration du bot Discord
# Fichier unique -- plus besoin de .env ni de prompt.txt

# --- System prompt ---
system_prompt: |
  Your name is pixieglow. You are a 21-year-old girl studying art.
  Talk naturally and never prefix your replies with your name.

# --- Secrets & chemins ---
discord_token: "ton_token_ici"
llama_cli_path: "bin/llama/llama-cli"
llama_model_path: "./models/Discord-Hermes-3-8B.Q3_K_M.gguf"
# Hôte du LLM -- utilisé uniquement en mode "server"
llm_host: "localhost"
# Port du LLM (CLI ou serveur HTTP llama-server)
llm_port: 3124
# Mode de connexion au LLM :
#   "proxy"  → bot client → HTTP → llm-server (qui gère le LLM via node-llama-cpp)
#             (nécessite `node self-cli.js server` dans un autre process)
#   "online" → appel HTTP à une API compatible OpenAI (chat/completions)
#             (nécessite llm_api_endpoint et llm_api_token)
llm_mode: "proxy"
# Endpoint API compatible OpenAI (mode online uniquement)
# llm_api_endpoint: "https://api.openai.com/v1/chat/completions"
# Token API (mode online uniquement)
# llm_api_token: "sk-..."
# Modèle (mode online uniquement)
# llm_model: "gpt-4o-mini"
tts_model_path: "./tts-engine/en_GB-southern_english_female-low.onnx"
tts_binary_path: "bin/piper/piper"
ffmpeg_path: "bin/ffmpeg/ffmpeg"
ffprobe_path: "bin/ffmpeg/ffprobe"

# --- Triggers (déclencheurs de réponse) ---
names:
  - "Luna"
  - "Pixie"
# Noms que le bot reconnaît comme étant le sien. Si un message contient un de ces noms,
# le bot considère qu'on s'adresse à lui et répondra toujours (sauf si ignore_chance_mention > 0).

keywords:
  - "hello"
  - "hi"
  - "hey"
  - "yo"
  - "help"
  - "question"
  - "ai"
  - "llm"
  - "bot"
# Mots-clés qui déclenchent une réponse du bot (avec une probabilité random_chance).
# Utile pour réagir à des salutations ou des sujets spécifiques.

random_chance: 0.015
# Probabilité qu'un message contenant un keyword déclenche une réponse (0.0 - 1.0).
# 0.015 = 1.5% de chance par message correspondant.

cooldown_seconds: 8
# Temps minimum (en secondes) entre deux réponses du bot dans un même channel,
# pour éviter de spammer.

reply_in_dm: true
# Si true, le bot répond aux messages privés (DM). Sinon, il les ignore.

# --- Mannerisms (comportement) ---
# La concentration est configurable par type de déclencheur.
# Chaque entrée définit les seuils de délai, d'ignore et de réaction.
concentration:
  mention:
    delay_min: 300
    delay_max: 1500
    ignore_chance: 0.02
    reaction_chance: 0.08
  dm:
    delay_min: 400
    delay_max: 1800
    ignore_chance: 0
    reaction_chance: 0.05
  name:
    delay_min: 800
    delay_max: 4000
    ignore_chance: 0.02
    reaction_chance: 0.06
  keyword:
    delay_min: 1000
    delay_max: 3500
    ignore_chance: 0.02
    reaction_chance: 0.04
  follow-up:
    delay_min: 500
    delay_max: 2000
    ignore_chance: 0.02
    reaction_chance: 0.03
  random:
    delay_min: 1500
    delay_max: 5000
    ignore_chance: 0.02
    reaction_chance: 0.02

server_emoji_chance: 0.3
# Probabilité que la réaction soit un emoji personnalisé du serveur (vs un emoji standard).

reactions:
  - "👀"
  - "😄"
  - "🤔"
  - "👋"
  - "🔥"
  - "💀"
  - "✨"
  - "😭"
  - "🤨"
  - "👌"
  - "🙏"
  - "💅"
  - "🗿"
  - "🌚"
# Liste des emojis standards utilisés pour les réactions.

# --- Spontaneous (messages spontanés) ---
spontaneous_interval_ms: 300000
# Intervalle (en ms) entre chaque tentative de message spontané.
# 300000 = 5 minutes. Le bot peut envoyer un message de lui-même dans un serveur.

spontaneous_chance: 0.12
# Probabilité (0.0 - 1.0) qu'une tentative spontanée aboutisse réellement.
# Combiné avec spontaneous_interval_ms, permet de contrôler la fréquence.

spontaneous_context_messages: 5
# Nombre de messages récents lus dans le channel pour alimenter le contexte
# du message spontané. Plus le nombre est élevé, plus le bot a de contexte.

spontaneous_whitelist: "*"
# Liste des IDs de serveurs (guilds) autorisés pour les messages spontanés.
# "*" = tous les serveurs.
# Exemple avec plusieurs serveurs : "123456789,987654321"
# Exemple avec un seul serveur : "123456789"

# --- Typos (simulation de fautes de frappe + correction) ---
typo_chance: 0.06
# Probabilité qu'un message contienne une faute de frappe (0.0 - 1.0).
typo_correction_delay_min: 2000
typo_correction_delay_max: 4000
# Intervalle (ms) avant que le bot corrige la faute en edittant le message.
typo_layout: "azerty"
# Disposition du clavier pour les fautes de touche adjacente : "azerty" | "qwerty".
typo_correction_style: "mixed"
# Style de correction des fautes : "edit" (édite tout le message), "message" (envoie "mot*"),
# ou "mixed" (50/50 aléatoire).

# --- Burst (fragmentation des réponses) ---
burst_chance: 0.15
# Probabilité qu'une réponse soit découpée en 2-3 fragments envoyés avec un délai
# (simule le rythme d'une personne qui tape par à-coups).
burst_delay_min: 1500
burst_delay_max: 4000
# Délai (ms) minimum et maximum entre chaque fragment du burst.

# --- Topic fatigue -- lassitude quand le même sujet revient trop souvent ---
topic_fatigue_enabled: true
# Active ou désactive le système de fatigue thématique.
topic_fatigue_window: 10
# Nombre de messages analysés pour détecter un sujet récurrent.
topic_fatigue_threshold: 3
# Nombre d'occurrences d'un même mot déclenchant la fatigue.
topic_fatigue_delay_multiplier: 2
# Multiplicateur de délai quand la fatigue est active.
topic_fatigue_ignore_bonus: 0.15
# Probabilité supplémentaire d'ignorer un message (0.0 - 1.0).

# --- Inactivity warmup -- délai plus long si le bot n'a pas parlé depuis longtemps ---
inactivity_warmup_minutes: 10
inactivity_warmup_multiplier: 2
# Simule le "réveil" : réponse plus lente après une période d'inactivité.

# --- Hesitation -- le bot hésite parfois avant de répondre ---
hesitation_chance: 0.15
hesitation_words:
  - "uh..."
  - "um..."
  - "well..."
  - "i mean..."
  - "hmm..."
  - "so..."

# --- Forget -- le bot oublie parfois de répondre ---
forget_chance: 0.03
# Probabilité faible que le bot ignore un message même après trigger.

# --- Dynamic status (statut Discord rotatif) ---
dynamic_status_interval_minutes: 15
# Intervalle de rotation entre les status (en minutes).
dynamic_status_presets:
  - status: "online"
    text: "with cats"
    type: 0
  - status: "online"
    text: "drawing"
    type: 0
  - status: "idle"
    text: "anime"
    type: 3
  - status: "online"
    text: "lofi hip hop"
    type: 2
# Le bot alterne entre ces presets, et passe en "invisible" pendant le sommeil.
# type: 0=Playing, 1=Streaming, 2=Listening, 3=Watching, 4=Custom, 5=Competing
# Laissez le tableau vide [] pour désactiver.

# --- Time schedules (présence variable) ---
# Tranches horaires avec comportements différents.
# Laissez vide pour toujours actif.
# behavior: sleep (seules mentions/DMs passent),
#           slow (délais ×3-5, réactions quasi nulles),
#           short (ignore chance +30%, réactions quasi nulles)
timezone: "Europe/Paris"
time_schedules:
  - start: "07:00"
    end: "10:00"
  - start: "10:00"
    end: "11:00"
    behavior: "short"
  - start: "11:00"
    end: "16:00"
  - start: "16:00"
    end: "18:00"
    behavior: "slow"
  - start: "18:00"
    end: "22:00"
  - start: "22:00"
    end: "07:00"
    behavior: "sleep"

# --- Session limit (pause after N exchanges) ---
session_message_limit: 8
# Nombre max d'échanges avant une pause. Le bot ignore les messages dans le
# channel pendant session_pause_seconds secondes, puis appelle /clear.
session_pause_seconds: 30
session_reset_minutes: 3
# Si personne ne parle dans le channel pendant reset_minutes, le compteur se remet à zéro.

# --- TTS / Voice messages ---
voice_message_chance: 0.12
# Probabilité qu'une réponse soit envoyée sous forme de message vocal (fichier audio)
# plutôt que de texte. Nécessite Piper TTS et un modèle vocal configurés.

# --- Reply styles (style de réponse) ---
reply_styles:
  - message_reference: true
    mention_replied_user: false
    weight: 50
  - message_reference: true
    mention_replied_user: true
    weight: 15
  - message_reference: false
    mention_replied_user: false
    weight: 30
  - message_reference: false
    mention_replied_user: true
    weight: 5
# Styles de réponse possibles avec leur poids (en pourcentage).
# message_reference: true  → répond en citant le message (reply)
# message_reference: false → répond sans citation
# mention_replied_user: true → ping/notifie l'utilisateur cité
# Les poids déterminent la probabilité de chaque style.
